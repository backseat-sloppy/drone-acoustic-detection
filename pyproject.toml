[project]
name = "drone-acoustic-detection"
version = "0.1.0"
description = "Latency-first acoustic drone detection: frozen log-mel frontend, tier-0 harmonic gate, INT8 depthwise-separable CNN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dl = [
    "torch>=2.4",
]

[project.scripts]
dad = "dad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
